name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede only PR feedback. Main tests can overlap; production serializes separately.
concurrency:
  group: pagedigest-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Select checks from the exact Git comparison
        id: scope
        run: uv run --no-project python tools/classify_ci_scope.py --github-event "$GITHUB_EVENT_PATH"

      - name: Check documentation and CI routing
        if: steps.scope.outputs.mode == 'docs'
        run: |
          uv run --no-project python -m unittest discover -s tools -p 'test_*.py' -v
          uv run --no-project python tools/check_docs.py
          uv run --no-project python tools/check_v1_status.py

      - name: Set up Node.js
        if: steps.scope.outputs.mode != 'docs'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/astro/package-lock.json
            packages/cli/package-lock.json

      - name: Set up Rust
        if: steps.scope.outputs.mode != 'docs'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo dependencies and build products
        if: steps.scope.outputs.mode != 'docs'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            implementations/rust-generator/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('implementations/rust-generator/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Run repository checks
        if: steps.scope.outputs.mode != 'docs'
        run: ./tools/run_checks.sh

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-pages.yml
    with:
      checked_sha: ${{ github.sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
